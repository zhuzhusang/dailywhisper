name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on push to main or master branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm install

      - name: Build App 🏗️
        run: npm run build
        env:
          # Automatically informs Vite of the GitHub environment
          GITHUB_ACTIONS: 'true'

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the build script populates
          branch: gh-pages # The branch the action deploys to
          clean: true
